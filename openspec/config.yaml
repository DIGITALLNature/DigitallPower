schema: spec-driven

context: |
  DigitallPower is a .NET 10 CLI for Dataverse and Power Platform operations. The CLI host is
  src/dgt.power; shared infrastructure lives in src/dgt.power.common; feature modules live under
  src/modules; tests use TUnit under tests/.

  Main specs describe current, user-relevant behavior and stable cross-module contracts. Ground
  them in the implementation, tests, schemas, and README. Do not turn them into implementation
  logs or duplicate API reference documentation. Keep decision rationale in concise ADRs under
  docs/architecture/decisions. Put local implementation details beside the relevant code or tests.

  Run every OpenSpec command through the repository-local CLI as `pnpm exec openspec ...`; never
  install OpenSpec globally. The version pinned by the root pnpm lockfile is the one the
  generated workflows are written for.
  Create a change proposal for public CLI/API or configuration behavior, schema changes, module or
  architecture changes, and work spanning capabilities. Trivial fixes, test-only changes, and
  behavior-preserving refactors do not need a proposal.

  Keep implemented changes active through beta integration and until a stable GitHub release
  containing the implementation has been published from main. A PR merged into beta is not
  sufficient, and a PR merged into main without a published stable release is not sufficient.
  Before any archive-related writes, verify that the implementation PR belongs to this change,
  has state MERGED, a non-null mergedAt, and baseRefName exactly main. Identify a published
  GitHub release that is neither a draft nor a prerelease; verify its tag points to a commit
  reachable from main and that the PR merge commit is an ancestor of that release commit.
  Completed tasks, green CI, a beta or prerelease publication, closing without merging, or a
  merge without a qualifying release are insufficient. If the PR or release cannot be
  verified, report the blocker and leave the change active. Archive only as a separate
  post-release follow-up using a checkout containing the released implementation, never as
  part of beta preparation or the implementation PR.

  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
githubCopilot:
  cloudAgent: true

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance: advisory instructions that the generated apply and archive
# workflows receive at runtime through `openspec instructions <operation> --json`.
operations:
  apply:
    guidance:
      - >-
        After implementation is complete, report "Implementation complete; awaiting stable
        release on main" instead of offering immediate archival.
  archive:
    guidance:
      - >-
        Keep the change active until a stable GitHub release containing the implementation
        has been published from main. A merge into beta, a merge into main without a
        published stable release, or a beta/prerelease publication is not sufficient.
      - >-
        Before any archive-related writes, verify the implementation PR with
        `gh pr view <number-or-url> --repo DIGITALLNature/DigitallPower --json state,mergedAt,baseRefName,mergeCommit,url`:
        require state MERGED, a non-null mergedAt, and baseRefName exactly main, and confirm
        the PR contains this change.
      - >-
        Verify the release with
        `gh release view <tag> --repo DIGITALLNature/DigitallPower --json isDraft,isPrerelease,publishedAt,tagName`:
        require a published, non-draft, non-prerelease release.
      - >-
        Fetch main and the release tag, then verify the PR merge commit is an ancestor of
        the release tag and the release tag commit is reachable from origin/main.
      - >-
        If the PR, release, or commit ancestry cannot be verified, report the blocker and
        leave the change active; do not archive, and do not let confirmation bypass this gate.
      - >-
        Archive only as a separate post-release follow-up using a checkout containing the
        released implementation, never during beta preparation or in the implementation PR.
