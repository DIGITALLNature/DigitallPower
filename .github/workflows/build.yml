name: Build DGTP

on:
  push:
    branches-ignore:
      - main
      - beta

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Setup pnpm and Node.js
      uses: pnpm/setup@v1
      with:
        cache: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Enable Automated Test Report Artifact Upload
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
          core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test --no-build --configuration Release -- --output Detailed

    - name: Install generated TypeScript Jest fixture dependencies
      run: pnpm --dir tests/dgt.power.codegeneration.tests/Fixtures/TslJest install --frozen-lockfile

    - name: Run generated TypeScript Jest tests
      run: pnpm test:tsl-jest
